# VPS-вариант (Oracle/любой Ubuntu): бот + Caddy с HTTPS.
# Статику и /api/* отдаёт сам бот, Caddy только терминирует TLS и проксирует.
# Бесплатные PaaS (Render/Koyeb) этот файл не используют — им хватает Dockerfile.
services:
  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      - HOST=0.0.0.0
      - PORT=8080
    restart: unless-stopped
    # Наружу не нужен (его закрывает Caddy), но install.sh проверяет
    # /api/health именно по localhost.
    ports:
      - "127.0.0.1:8080:8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - bot
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
