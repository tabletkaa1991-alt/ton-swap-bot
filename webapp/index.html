<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TON ⇄ USDT</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@2/dist/tonconnect-ui.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px; font: 16px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #131720; color: #eaf0f8;
    }
    .card { max-width: 520px; margin: 0 auto; display: grid; gap: 14px; }
    h1 { font-size: 20px; margin: 4px 0 0; }
    .muted { color: #93a1b5; font-size: 13px; }
    .field { display: grid; gap: 6px; }
    .row { display: flex; gap: 8px; align-items: center; }
    input, select {
      width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #2b3444;
      background: #1b2130; color: inherit; font: inherit;
    }
    button {
      padding: 13px 16px; border-radius: 10px; border: 0; font: inherit; font-weight: 600;
      background: #2f80ed; color: #fff; cursor: pointer;
    }
    button:disabled { background: #2b3444; color: #93a1b5; cursor: not-allowed; }
    button.ghost { background: transparent; border: 1px solid #2b3444; color: #eaf0f8; font-weight: 500; }
    .summary { border: 1px solid #2b3444; border-radius: 12px; padding: 12px; display: grid; gap: 6px; }
    .summary div { display: flex; justify-content: space-between; gap: 12px; }
    .summary b { white-space: nowrap; }
    .error { color: #ff8080; }
    .ok { color: #6fdc8c; }
    .hint {
      border: 1px solid #6b4a1f; background: #2a2113; color: #ffcf8a;
      border-radius: 10px; padding: 10px 12px; font-size: 14px; line-height: 1.4;
    }
    .hint a { color: #ffd9a8; }
    #toc { display: grid; gap: 8px; }
    a { color: #7fb2ff; }
  </style>
</head>
<body>
  <div class="card">
    <h1>TON ⇄ USDT</h1>
    <p class="muted">Обмен идёт в вашем кошельке. Бот не хранит средства и не имеет доступа к ключам.</p>

    <div id="hint" class="hint" hidden></div>

    <div id="toc"></div>

    <div class="row">
      <select id="direction" aria-label="Направление обмена">
        <option value="ton-usdt">TON → USDT</option>
        <option value="usdt-ton">USDT → TON</option>
      </select>
    </div>

    <div class="field">
      <label for="amount" class="muted">Сумма</label>
      <input id="amount" inputmode="decimal" placeholder="1.0" value="1" />
    </div>

    <div class="summary">
      <div><span class="muted">Курс</span><b id="rate">—</b></div>
      <div><span class="muted">Комиссия сервиса</span><b id="fee">—</b></div>
      <div><span class="muted">Вы получите</span><b id="receive">—</b></div>
      <div><span class="muted">Спишется с кошелька</span><b id="total">—</b></div>
    </div>

    <button id="swap" disabled>Обменять</button>
    <p id="status" class="muted"></p>
    <p class="muted">
      Своп идёт через пул STON.fi, проскальзывание ограничено 1%. Ключи и средства остаются в вашем кошельке.
    </p>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
